<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .input-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f44336;
            color: white;
        }

        .btn-secondary:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .result-section {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bmi-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .bmi-category {
            font-size: 1.5em;
            font-weight: 600;
        }

        .history-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
        }

        .history-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .no-history {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }

        .refresh-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💪 BMI Calculator</h1>
            <p>Track your Body Mass Index with ease</p>
        </div>

        <div class="card input-section">
            <h2>📝 Input Your Data</h2>
            
            <div id="alert" class="alert"></div>

            <form id="bmiForm">
                <div class="form-group">
                    <label for="name">Nama</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="weight">Berat Badan (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="e.g., 70.5" required>
                </div>

                <div class="form-group">
                    <label for="height">Tinggi Badan (m)</label>
                    <input type="number" id="height" step="0.01" placeholder="e.g., 1.75" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Calculate & Save</button>
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
                </div>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Calculating...</p>
            </div>

            <div id="result" class="result-section">
                <p>Your BMI is</p>
                <div id="bmiValue" class="bmi-value"></div>
                <div id="bmiCategory" class="bmi-category"></div>
            </div>
        </div>

        <div class="card history-section">
            <h2>📊 History</h2>
            <div id="historyList" class="history-list">
                <div class="no-history">No history available yet</div>
            </div>
            <button class="refresh-btn" onclick="loadHistory()">🔄 Refresh History</button>
        </div>
    </div>

    <script>
        // Load history on page load
        window.onload = function() {
            loadHistory();
        };

        // Form submission
        document.getElementById('bmiForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);

            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');
            hideAlert();

            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, weight, height })
                });

                const data = await response.json();

                // Hide loading
                document.getElementById('loading').classList.remove('show');

                if (response.ok) {
                    // Show result
                    document.getElementById('bmiValue').textContent = data.bmi;
                    document.getElementById('bmiValue').style.color = data.color;
                    document.getElementById('bmiCategory').textContent = data.category;
                    document.getElementById('bmiCategory').style.color = data.color;
                    document.getElementById('result').style.background = data.color + '20';
                    document.getElementById('result').classList.add('show');

                    // Show success message
                    showAlert('Data saved successfully! 🎉', 'success');

                    // Clear form
                    clearForm();

                    // Reload history
                    loadHistory();
                } else {
                    showAlert(data.error || 'An error occurred', 'error');
                }
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                showAlert('Failed to connect to server', 'error');
            }
        });

        function clearForm() {
            document.getElementById('bmiForm').reset();
            document.getElementById('name').focus();
        }

        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const data = await response.json();

                const historyList = document.getElementById('historyList');

                if (data.history && data.history.length > 0) {
                    historyList.innerHTML = data.history.map((item, index) => 
                        `<div class="history-item">
                            <strong>#${index + 1}</strong> ${item}
                        </div>`
                    ).join('');
                } else {
                    historyList.innerHTML = '<div class="no-history">No history available yet</div>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                hideAlert();
            }, 5000);
        }

        function hideAlert() {
            const alert = document.getElementById('alert');
            alert.classList.remove('show');
        }
    </script>
</body>
</html>
